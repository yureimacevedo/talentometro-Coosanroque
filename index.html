<style>
  :root{
    --bg:#EDEEE9; --surface:#FFFFFF; --surface-alt:#E3E5DE;
    --ink:#232620; --ink-soft:#5C6058; --ink-faint:#8B8F84;
    --accent:#276AAB; --accent-deep:#1A4F82; --accent-soft:#97B1CA; --accent-pale:#C0CAD3;
    --moss:#6B7A5E; --moss-pale:#E7ECE2; --clay:#A9613D; --clay-pale:#F3E4DA; --gold:#B79A64;
    --border:#D6D8D0; --border-strong:#BFC2B8; --radius:3px;
    --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif; --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;}
  ::selection{background:var(--accent-soft);}
  a{color:var(--accent);}
  .loading{min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-family:var(--font-mono); font-size:13px;}

  .app{display:grid; grid-template-columns:236px 1fr; min-height:100vh;}
  @media (max-width:860px){ .app{grid-template-columns:1fr;} .sidebar{position:sticky; top:0; z-index:20;} }

  .sidebar{background:var(--accent-deep); color:#EAF0F2; padding:24px 22px; display:flex; flex-direction:column; gap:20px;}
  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand-row{display:flex; align-items:center; gap:10px;}
  .brand-logo-block{display:flex; flex-direction:column; align-items:flex-start; gap:8px;}
  .brand-logo{height:32px; width:auto; max-width:120px; object-fit:contain; display:block;}
  .logo-card{background:#fff; border-radius:10px; padding:8px 10px; display:inline-flex; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,0.18);}
  .logo-card.big{padding:16px 20px; border-radius:14px;}
  .mark-badge{display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); border-radius:999px; padding:6px 14px; font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-soft);}
  .mark-badge .dot{width:6px; height:6px; border-radius:50%; background:var(--accent-soft); flex-shrink:0;}
  .copyright-line{font-size:10.5px; color:#7C9AA6; margin-top:2px;}
  .portal-top .copyright-line{color:var(--ink-faint); text-align:center; margin-top:2px;}
  .brand .mark{font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; color:var(--accent-soft); text-transform:uppercase;}
  .brand h1{font-family:var(--font-display); font-size:17px; font-weight:600; margin:2px 0 0; letter-spacing:-.01em;}
  .brand .sub{font-size:12px; color:#B7CBD3; margin-top:4px;}
  .entidad-name{font-family:var(--font-mono); font-size:12.5px; font-weight:600; color:var(--accent); margin-top:5px; letter-spacing:.02em;}
  .entidad-name.on-dark{color:var(--accent-soft);}

  .periodo-select{width:100%; padding:8px 10px; border-radius:var(--radius); border:1px solid rgba(255,255,255,0.25); background:rgba(255,255,255,0.06); color:#EAF0F2; font-size:12.5px; font-family:var(--font-body);}
  .periodo-select option{color:#111;}

  nav.tabs{display:flex; flex-direction:column; gap:2px;}
  nav.tabs .group-label{font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#7C9AA6; margin:12px 0 2px 12px;}
  nav.tabs .group-label:first-child{margin-top:0;}
  nav.tabs button{all:unset; cursor:pointer; display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:var(--radius); font-size:13.5px; font-weight:500; color:#CBDBDF; transition:background .15s, color .15s;}
  nav.tabs button .num{font-family:var(--font-mono); font-size:11px; color:#7C9AA6; width:16px;}
  nav.tabs button:hover{background:rgba(255,255,255,0.06); color:#fff;}
  nav.tabs button.active{background:#EAF0F2; color:var(--accent-deep);}
  nav.tabs button.active .num{color:var(--accent);}
  nav.tabs button:disabled{opacity:.35; cursor:not-allowed;}

  .portal-link{all:unset; cursor:pointer; display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; color:#EAF0F2; padding:10px 12px; border:1px solid rgba(255,255,255,0.25); border-radius:var(--radius); justify-content:center;}
  .portal-link:hover{background:rgba(255,255,255,0.1);}
  .sidebar-foot{margin-top:auto; font-size:11px; color:#7C9AA6; border-top:1px solid rgba(255,255,255,0.12); padding-top:14px; line-height:1.6;}

  main{padding:36px 44px 80px; max-width:1180px;}
  @media (max-width:860px){ main{padding:24px 18px 60px;} }

  .view-head{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:26px; flex-wrap:wrap;}
  .view-head .eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--moss); margin-bottom:6px; display:block;}
  .view-head h2{font-family:var(--font-display); font-size:25px; font-weight:600; margin:0; letter-spacing:-.01em;}
  .view-head p.desc{color:var(--ink-soft); font-size:13.5px; max-width:62ch; margin:8px 0 0;}
  .view-head-actions{display:flex; gap:8px; flex-wrap:wrap;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px;}
  .card + .card{margin-top:16px;}
  .card h3{font-family:var(--font-display); font-size:15px; font-weight:600; margin:0 0 4px;}
  .card .hint{color:var(--ink-soft); font-size:12.5px; margin:0 0 14px;}

  .btn{all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-family:var(--font-body); font-weight:600; font-size:12.5px; padding:9px 16px; border-radius:var(--radius); background:var(--accent); color:#fff; transition:background .15s, transform .1s;}
  .btn:hover{background:var(--accent-deep);}
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:transparent; color:var(--accent); border:1px solid var(--border-strong);}
  .btn.secondary:hover{background:var(--accent-pale); border-color:var(--accent);}
  .btn.ghost{background:transparent; color:var(--ink-soft); padding:6px 8px;}
  .btn.ghost:hover{color:var(--clay);}
  .btn.small{padding:6px 12px; font-size:11.5px;}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}

  label{font-size:12px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:5px;}
  input[type=text], input[type=number], input[type=date], input[type=email], input[type=password], select, textarea{
    font-family:var(--font-body); font-size:13.5px; padding:8px 10px; border:1px solid var(--border-strong);
    border-radius:var(--radius); background:#fff; color:var(--ink); width:100%;
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent-soft); outline-offset:1px; border-color:var(--accent);}
  .field{margin-bottom:14px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .field-row.three{grid-template-columns:1fr 1fr 1fr;}
  @media (max-width:700px){.field-row, .field-row.three{grid-template-columns:1fr;}}

  table{border-collapse:collapse; width:100%;}
  th{text-align:left; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); font-weight:500; padding:0 10px 8px; border-bottom:1px solid var(--border-strong);}
  td{padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:middle; font-size:13px;}
  tr:last-child td{border-bottom:none;}
  .pct-input{width:64px; font-family:var(--font-mono); text-align:right; padding:5px 6px;}
  .row-total{font-family:var(--font-mono); font-weight:600; font-size:12.5px;}
  .row-total.ok{color:var(--moss);} .row-total.bad{color:var(--clay);}

  .ribbon{display:flex; height:8px; width:100%; border-radius:2px; overflow:hidden; background:var(--surface-alt); margin-top:4px;}
  .ribbon span{height:100%;}

  .tag{display:inline-block; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.04em; padding:2px 7px; border-radius:2px; background:var(--accent-pale); color:var(--accent-deep); text-transform:uppercase;}
  .tag.moss{background:var(--moss-pale); color:#3F4A36;} .tag.clay{background:var(--clay-pale); color:#7A4529;}
  .tag.gold{background:#F4EDDD; color:#7A5F26;}
  .tag.pending{background:var(--clay-pale); color:#7A4529;} .tag.done{background:var(--moss-pale); color:#3F4A36;}

  .empty{border:1px dashed var(--border-strong); border-radius:var(--radius); padding:34px 20px; text-align:center; color:var(--ink-soft); font-size:13px;}
  .empty .btn{margin-top:14px;}

  .collab-item{display:flex; align-items:center; justify-content:space-between; padding:14px 4px; border-bottom:1px solid var(--border); gap:14px; flex-wrap:wrap;}
  .collab-item:last-child{border-bottom:none;}
  .collab-main{display:flex; align-items:center; gap:14px;}
  .avatar{width:34px; height:34px; border-radius:50%; background:var(--accent-pale); color:var(--accent-deep); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:600; font-size:13px; flex-shrink:0;}
  .collab-name{font-weight:600; font-size:13.5px;}
  .collab-meta{color:var(--ink-soft); font-size:12px; margin-top:1px;}
  .collab-actions{display:flex; gap:8px; align-items:center;}
  .access-code{font-family:var(--font-mono); font-size:12px; background:var(--surface-alt); padding:4px 8px; border-radius:2px; letter-spacing:.05em;}

  .role-block{border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px;}
  .role-block-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;}
  .role-block-head h4{margin:0; font-size:13.5px; font-family:var(--font-display); font-weight:600;}
  .eval-entry{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-top:1px solid var(--border); font-size:12.5px; gap:10px; flex-wrap:wrap;}
  .eval-entry .eval-scores{color:var(--ink-soft); font-family:var(--font-mono); font-size:11.5px;}

  .slider-row{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  .slider-row label{margin:0; width:170px; flex-shrink:0;}
  .slider-row input[type=range]{flex:1; accent-color:var(--accent);}
  .slider-val{font-family:var(--font-mono); font-weight:600; font-size:13px; width:38px; text-align:right;}

  .question-block{margin-bottom:18px;}
  .question-block .qtext{font-size:13.5px; font-weight:500; margin-bottom:8px;}
  .likert{display:flex; gap:6px; flex-wrap:wrap;}
  .likert button{all:unset; cursor:pointer; font-family:var(--font-mono); font-size:12px; padding:8px 4px; width:64px; text-align:center; border:1px solid var(--border-strong); border-radius:var(--radius); color:var(--ink-soft); transition:all .12s;}
  .likert button:hover{border-color:var(--accent);}
  .likert button.sel{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
  .likert button:disabled, .quiz-opts button:disabled{cursor:default; opacity:.7;}
  .likert button:disabled:hover, .quiz-opts button:disabled:hover{border-color:var(--border-strong);}
  .likert button.sel:disabled{opacity:1;}
  .quiz-opts button.sel:disabled{opacity:1;}
  .likert-labels{display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-faint); margin-top:4px;}
