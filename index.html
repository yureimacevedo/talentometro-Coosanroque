<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talentómetro · Coosanroque</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232A4256'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23A9C1CE' stroke-width='6'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23EAF0F2' stroke-width='6' stroke-dasharray='75 119' stroke-linecap='round' transform='rotate(-90 32 32)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#EDEEE9; --surface:#FFFFFF; --surface-alt:#E3E5DE;
    --ink:#232620; --ink-soft:#5C6058; --ink-faint:#8B8F84;
    --accent:#276AAB; --accent-deep:#1A4F82; --accent-soft:#97B1CA; --accent-pale:#C0CAD3;
    --moss:#6B7A5E; --moss-pale:#E7ECE2; --clay:#A9613D; --clay-pale:#F3E4DA; --gold:#B79A64;
    --border:#D6D8D0; --border-strong:#BFC2B8; --radius:3px;
    --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif; --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;}
  ::selection{background:var(--accent-soft);}
  a{color:var(--accent);}
  .loading{min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-family:var(--font-mono); font-size:13px;}

  .app{display:grid; grid-template-columns:236px 1fr; min-height:100vh;}
  @media (max-width:860px){ .app{grid-template-columns:1fr;} .sidebar{position:sticky; top:0; z-index:20;} }

  .sidebar{background:var(--accent-deep); color:#EAF0F2; padding:24px 22px; display:flex; flex-direction:column; gap:20px;}
  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand-row{display:flex; align-items:center; gap:10px;}
  .brand-logo-block{display:flex; flex-direction:column; align-items:flex-start; gap:8px;}
  .brand-logo{height:32px; width:auto; max-width:120px; object-fit:contain; display:block;}
  .logo-card{background:#fff; border-radius:10px; padding:8px 10px; display:inline-flex; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,0.18);}
  .logo-card.big{padding:16px 20px; border-radius:14px;}
  .mark-badge{display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); border-radius:999px; padding:6px 14px; font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-soft);}
  .mark-badge .dot{width:6px; height:6px; border-radius:50%; background:var(--accent-soft); flex-shrink:0;}
  .copyright-line{font-size:10.5px; color:#7C9AA6; margin-top:2px;}
  .portal-top .copyright-line{color:var(--ink-faint); text-align:center; margin-top:2px;}
  .brand .mark{font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; color:var(--accent-soft); text-transform:uppercase;}
  .brand h1{font-family:var(--font-display); font-size:17px; font-weight:600; margin:2px 0 0; letter-spacing:-.01em;}
  .brand .sub{font-size:12px; color:#B7CBD3; margin-top:4px;}
  .entidad-name{font-family:var(--font-mono); font-size:12.5px; font-weight:600; color:var(--accent); margin-top:5px; letter-spacing:.02em;}
  .entidad-name.on-dark{color:var(--accent-soft);}

  .periodo-select{width:100%; padding:8px 10px; border-radius:var(--radius); border:1px solid rgba(255,255,255,0.25); background:rgba(255,255,255,0.06); color:#EAF0F2; font-size:12.5px; font-family:var(--font-body);}
  .periodo-select option{color:#111;}

  nav.tabs{display:flex; flex-direction:column; gap:2px;}
  nav.tabs .group-label{font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#7C9AA6; margin:12px 0 2px 12px;}
  nav.tabs .group-label:first-child{margin-top:0;}
  nav.tabs button{all:unset; cursor:pointer; display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:var(--radius); font-size:13.5px; font-weight:500; color:#CBDBDF; transition:background .15s, color .15s;}
  nav.tabs button .num{font-family:var(--font-mono); font-size:11px; color:#7C9AA6; width:16px;}
  nav.tabs button:hover{background:rgba(255,255,255,0.06); color:#fff;}
  nav.tabs button.active{background:#EAF0F2; color:var(--accent-deep);}
  nav.tabs button.active .num{color:var(--accent);}
  nav.tabs button:disabled{opacity:.35; cursor:not-allowed;}

  .portal-link{all:unset; cursor:pointer; display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; color:#EAF0F2; padding:10px 12px; border:1px solid rgba(255,255,255,0.25); border-radius:var(--radius); justify-content:center;}
  .portal-link:hover{background:rgba(255,255,255,0.1);}
  .sidebar-foot{margin-top:auto; font-size:11px; color:#7C9AA6; border-top:1px solid rgba(255,255,255,0.12); padding-top:14px; line-height:1.6;}

  main{padding:36px 44px 80px; max-width:1180px;}
  @media (max-width:860px){ main{padding:24px 18px 60px;} }

  .view-head{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:26px; flex-wrap:wrap;}
  .view-head .eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--moss); margin-bottom:6px; display:block;}
  .view-head h2{font-family:var(--font-display); font-size:25px; font-weight:600; margin:0; letter-spacing:-.01em;}
  .view-head p.desc{color:var(--ink-soft); font-size:13.5px; max-width:62ch; margin:8px 0 0;}
  .view-head-actions{display:flex; gap:8px; flex-wrap:wrap;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px;}
  .card + .card{margin-top:16px;}
  .card h3{font-family:var(--font-display); font-size:15px; font-weight:600; margin:0 0 4px;}
  .card .hint{color:var(--ink-soft); font-size:12.5px; margin:0 0 14px;}

  .btn{all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-family:var(--font-body); font-weight:600; font-size:12.5px; padding:9px 16px; border-radius:var(--radius); background:var(--accent); color:#fff; transition:background .15s, transform .1s;}
  .btn:hover{background:var(--accent-deep);}
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:transparent; color:var(--accent); border:1px solid var(--border-strong);}
  .btn.secondary:hover{background:var(--accent-pale); border-color:var(--accent);}
  .btn.ghost{background:transparent; color:var(--ink-soft); padding:6px 8px;}
  .btn.ghost:hover{color:var(--clay);}
  .btn.small{padding:6px 12px; font-size:11.5px;}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}

  label{font-size:12px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:5px;}
  input[type=text], input[type=number], input[type=date], input[type=email], input[type=password], select, textarea{
    font-family:var(--font-body); font-size:13.5px; padding:8px 10px; border:1px solid var(--border-strong);
    border-radius:var(--radius); background:#fff; color:var(--ink); width:100%;
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent-soft); outline-offset:1px; border-color:var(--accent);}
  .field{margin-bottom:14px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .field-row.three{grid-template-columns:1fr 1fr 1fr;}
  @media (max-width:700px){.field-row, .field-row.three{grid-template-columns:1fr;}}

  table{border-collapse:collapse; width:100%;}
  th{text-align:left; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); font-weight:500; padding:0 10px 8px; border-bottom:1px solid var(--border-strong);}
  td{padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:middle; font-size:13px;}
  tr:last-child td{border-bottom:none;}
  .pct-input{width:64px; font-family:var(--font-mono); text-align:right; padding:5px 6px;}
  .row-total{font-family:var(--font-mono); font-weight:600; font-size:12.5px;}
  .row-total.ok{color:var(--moss);} .row-total.bad{color:var(--clay);}

  .ribbon{display:flex; height:8px; width:100%; border-radius:2px; overflow:hidden; background:var(--surface-alt); margin-top:4px;}
  .ribbon span{height:100%;}

  .tag{display:inline-block; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.04em; padding:2px 7px; border-radius:2px; background:var(--accent-pale); color:var(--accent-deep); text-transform:uppercase;}
  .tag.moss{background:var(--moss-pale); color:#3F4A36;} .tag.clay{background:var(--clay-pale); color:#7A4529;}
  .tag.gold{background:#F4EDDD; color:#7A5F26;}
  .tag.pending{background:var(--clay-pale); color:#7A4529;} .tag.done{background:var(--moss-pale); color:#3F4A36;}

  .empty{border:1px dashed var(--border-strong); border-radius:var(--radius); padding:34px 20px; text-align:center; color:var(--ink-soft); font-size:13px;}
  .empty .btn{margin-top:14px;}

  .collab-item{display:flex; align-items:center; justify-content:space-between; padding:14px 4px; border-bottom:1px solid var(--border); gap:14px; flex-wrap:wrap;}
  .collab-item:last-child{border-bottom:none;}
  .collab-main{display:flex; align-items:center; gap:14px;}
  .avatar{width:34px; height:34px; border-radius:50%; background:var(--accent-pale); color:var(--accent-deep); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:600; font-size:13px; flex-shrink:0;}
  .collab-name{font-weight:600; font-size:13.5px;}
  .collab-meta{color:var(--ink-soft); font-size:12px; margin-top:1px;}
  .collab-actions{display:flex; gap:8px; align-items:center;}
  .access-code{font-family:var(--font-mono); font-size:12px; background:var(--surface-alt); padding:4px 8px; border-radius:2px; letter-spacing:.05em;}

  .role-block{border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px;}
  .role-block-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;}
  .role-block-head h4{margin:0; font-size:13.5px; font-family:var(--font-display); font-weight:600;}
  .eval-entry{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-top:1px solid var(--border); font-size:12.5px; gap:10px; flex-wrap:wrap;}
  .eval-entry .eval-scores{color:var(--ink-soft); font-family:var(--font-mono); font-size:11.5px;}

  .slider-row{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  .slider-row label{margin:0; width:170px; flex-shrink:0;}
  .slider-row input[type=range]{flex:1; accent-color:var(--accent);}
  .slider-val{font-family:var(--font-mono); font-weight:600; font-size:13px; width:38px; text-align:right;}

  .question-block{margin-bottom:18px;}
  .question-block .qtext{font-size:13.5px; font-weight:500; margin-bottom:8px;}
  .likert{display:flex; gap:6px; flex-wrap:wrap;}
  .likert button{all:unset; cursor:pointer; font-family:var(--font-mono); font-size:12px; padding:8px 4px; width:64px; text-align:center; border:1px solid var(--border-strong); border-radius:var(--radius); color:var(--ink-soft); transition:all .12s;}
  .likert button:hover{border-color:var(--accent);}
  .likert button.sel{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
  .likert button:disabled, .quiz-opts button:disabled{cursor:default; opacity:.7;}
  .likert button:disabled:hover, .quiz-opts button:disabled:hover{border-color:var(--border-strong);}
  .likert button.sel:disabled{opacity:1;}
  .quiz-opts button.sel:disabled{opacity:1;}
  .likert-labels{display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-faint); margin-top:4px;}

  .quiz-opts{display:flex; flex-direction:column; gap:8px;}
  .quiz-opts button{all:unset; cursor:pointer; text-align:left; font-size:13px; padding:10px 12px; border:1px solid var(--border-strong); border-radius:var(--radius); transition:all .12s;}
  .quiz-opts button:hover{border-color:var(--accent);}
  .quiz-opts button.sel{background:var(--accent-pale); border-color:var(--accent); font-weight:600;}

  .result-row{display:grid; grid-template-columns:2fr 1fr 90px 100px 32px; gap:14px; align-items:center; padding:13px 4px; border-bottom:1px solid var(--border); cursor:pointer;}
  .result-row:hover{background:var(--accent-pale);}
  .result-row:last-child{border-bottom:none;}
  .result-name{font-weight:600; font-size:13.5px;}
  .result-cat{color:var(--ink-soft); font-size:11.5px;}
  .score-num{font-family:var(--font-mono); font-weight:700; font-size:16px; text-align:right;}

  .detail-panel{border-top:2px solid var(--accent); background:var(--accent-pale); padding:20px 22px; margin-top:-1px; border-radius:0 0 var(--radius) var(--radius);}
  .breakdown-row{margin-bottom:12px;}
  .breakdown-row .bh{display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px; color:var(--ink-soft);}
  .breakdown-row .bh b{color:var(--ink); font-family:var(--font-mono);}

  .loading-dots::after{content:'…'; animation:dots 1.2s steps(4,end) infinite;}
  @keyframes dots{0%,20%{content:'';}40%{content:'.';}60%{content:'..';}80%,100%{content:'...';}}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(12px); background:var(--ink); color:#fff; padding:10px 18px; border-radius:var(--radius); font-size:12.5px; opacity:0; pointer-events:none; transition:all .25s ease; z-index:100;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .config-cat{margin-bottom:24px;}
  .config-cat h4{font-family:var(--font-display); font-size:13.5px; font-weight:600; margin:0 0 10px; display:flex; align-items:center; gap:8px;}
  .checkline{display:flex; align-items:center; gap:8px;}
  .checkline input[type=checkbox]{accent-color:var(--accent); width:15px; height:15px;}

  .save-bar{display:flex; justify-content:flex-end; gap:10px; margin-top:18px; padding-top:16px; border-top:1px solid var(--border);}

  .mini-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:6px;}
  @media (max-width:700px){.mini-grid{grid-template-columns:repeat(2,1fr);}}
  .mini-stat{border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px;}
  .mini-stat .mv{font-family:var(--font-mono); font-size:20px; font-weight:700;}
  .mini-stat .ml{font-size:11px; color:var(--ink-soft); margin-top:2px;}

  .gauge{position:relative; width:56px; height:56px; flex-shrink:0;}
  .gauge svg{transform:rotate(-90deg);}
  .gauge .gval{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:12px;}
  .gauge.big{width:120px; height:120px;}
  .gauge.big .gval{font-size:24px;}

  .q-card{border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px;}
  .q-card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
  .q-card-head h4{margin:0 0 3px; font-family:var(--font-display); font-size:14px;}
  .q-card-meta{font-size:11.5px; color:var(--ink-soft);}
  .q-list{margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);}
  .q-list-item{display:flex; justify-content:space-between; align-items:flex-start; padding:7px 0; font-size:12.5px; gap:10px;}
  .q-num{color:var(--ink-faint); font-family:var(--font-mono); font-size:11.5px;}
  .q-opts-mini{font-size:11.5px; color:var(--ink-soft); margin-top:3px;}
  .q-opts-mini b{color:var(--moss); font-weight:600;}
  .quiz-add-form{border:1px dashed var(--border-strong); border-radius:var(--radius); padding:12px; margin-top:8px;}
  .quiz-add-form .opt-row{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .quiz-add-form .opt-row input[type=radio]{accent-color:var(--moss); width:16px; height:16px; flex-shrink:0;}

  .assign-collab{border:1px solid var(--border); border-radius:var(--radius); margin-bottom:14px; overflow:hidden;}
  .assign-collab-head{display:flex; justify-content:space-between; align-items:center; padding:14px 18px; background:var(--surface-alt);}
  .assign-role-row{display:flex; align-items:center; gap:10px; padding:10px 18px; border-top:1px solid var(--border); flex-wrap:wrap;}
  .assign-role-row .role-name{width:230px; font-weight:600; font-size:12.5px; flex-shrink:0;}
  .assign-chip{display:flex; align-items:center; gap:6px; background:var(--accent-pale); color:var(--accent-deep); padding:5px 10px; border-radius:14px; font-size:12px;}
  .assign-chip button{all:unset; cursor:pointer; color:var(--accent-deep); font-weight:700; line-height:1;}
  .assign-add-form{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .assign-add-form select, .assign-add-form input{width:auto; min-width:160px;}

  .periodo-card{border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin-bottom:14px;}
  .periodo-card.is-active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
  .periodo-card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap;}
  .semaforo-config{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--border);}
  .semaforo-band{border-radius:var(--radius); padding:8px 10px; font-size:11.5px;}
  .semaforo-band.critico{background:var(--clay-pale); color:#7A4529;}
  .semaforo-band.precaucion{background:#F4EDDD; color:#7A5F26;}
  .semaforo-band.optimo{background:var(--moss-pale); color:#3F4A36;}
  .semaforo-band input{margin-top:4px; padding:5px 6px; font-family:var(--font-mono);}

  #portal-shell{min-height:100vh; background:var(--bg);}
  .portal-top{display:flex; justify-content:space-between; align-items:center; padding:20px 40px; border-bottom:1px solid var(--border);}
  .portal-top .brand h1{color:var(--ink); font-size:16px;}
  .portal-top .brand .mark{color:var(--moss);}
  .portal-body{max-width:640px; margin:0 auto; padding:60px 24px;}
  .login-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:40px 36px; text-align:center;}
  .login-card h2{font-family:var(--font-display); font-size:22px; margin:0 0 6px;}
  .login-card p{color:var(--ink-soft); font-size:13px; margin:0 0 24px;}
  .login-card input{text-align:center; font-family:var(--font-mono); font-size:18px; letter-spacing:.15em; text-transform:uppercase; padding:14px;}
  .login-card input[type=email]{text-transform:none; letter-spacing:normal; font-family:var(--font-body); font-size:14px;}
  .login-card .btn{width:100%; justify-content:center; margin-top:14px; padding:12px;}
  .login-error{color:var(--clay); font-size:12.5px; margin-top:10px;}

  .task-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:14px;}
  .task-card .tinfo b{font-size:13.5px;}
  .task-card .tinfo div.tmeta{font-size:12px; color:var(--ink-soft); margin-top:2px;}

r key={roleKey}><td>{ROLES.find(r=>r.key===roleKey)?.label||roleKey}</td><td>{w}%</td><td>{val!==null&&val!==undefined?val.toFixed(1):'Sin datos'}</td></tr>);})}</tbody></table><div className="print-section-title">Por componente</div><table className="print-table"><thead><tr><th>Componente</th><th>Puntaje</th></tr></thead><tbody>{COMPONENTS.map(c=>(<tr key={c.key}><td>{c.label}</td><td>{breakdown[c.key]!==null?breakdown[c.key].toFixed(1):'Sin datos'}</td></tr>))}</tbody></table></div>);})}</div></section>);};const ResultDetail=({p,fs,periodo,evaluations,questionnaires})=>{const breakdown=componentBreakdownFor(p,periodo.evaluatorWeights,periodo.componentWeights,evaluations,periodo.componentWeightsByCategoria);const mejora=areasDeMejora(p,evaluations,questionnaires||[]);const[verTodo,setVerTodo]=useState(false);return(<div className="detail-panel"><div style={{display:'flex',gap:22,alignItems:'center',marginBottom:16}}><Gauge value={fs.score}big/><div><div style={{fontFamily:'var(--font-display)',fontSize:16,fontWeight:600}}>{p.nombre}</div><div className="collab-meta">Score final ponderado sobre 100</div></div></div><div className="field-row"><div><h4 style={{margin:'0 0 10px',fontFamily:'var(--font-display)'}}>Por evaluador</h4>{Object.entries((rolesRequeridosPara(periodo,p))).map(([roleKey,w])=>{const val=fs.roleScores[roleKey];return(<div className="breakdown-row"key={roleKey}><div className="bh"><span>{ROLES.find(r=>r.key===roleKey)?.label||roleKey}· peso{w}%</span><b>{val!==null&&val!==undefined?val.toFixed(1):'—'}</b></div><div className="ribbon"><span style={{width:(val!==null&&val!==undefined?val:0)+'%',background:ROLE_COLORS[roleKey]||'var(--ink-faint)'}}></span></div></div>);})}</div><div><h4 style={{margin:'0 0 10px',fontFamily:'var(--font-display)'}}>Por componente</h4>{COMPONENTS.map(c=>{const val=breakdown[c.key];return(<div className="breakdown-row"key={c.key}><div className="bh"><span>{c.label}</span><b>{val!==null?val.toFixed(1):'—'}</b></div><div className="ribbon"><span style={{width:(val!==null?val:0)+'%',background:COMPONENT_COLORS[c.key]}}></span></div></div>);})}</div></div>{(mejora.comportamiento.length>0||mejora.quiz.length>0)?(<div style={{marginTop:20,paddingTop:16,borderTop:'1px solid var(--border)'}}><h4 style={{margin:'0 0 4px',fontFamily:'var(--font-display)',color:'var(--clay)'}}>Áreas para plan de acción</h4><p className="hint"style={{marginTop:0}}>Promedio entre todos los evaluadores externos que calificaron cada afirmación(por debajo de 4 sobre 5)— nunca una respuesta individual.</p>{mejora.comportamiento.length>0&&(<ul style={{margin:'0 0 12px',paddingLeft:20,fontSize:13}}>{mejora.comportamiento.map((m,i)=>(<li key={i}style={{marginBottom:4}}><span style={{color:'var(--ink-faint)',fontFamily:'var(--font-mono)',fontSize:11}}>{m.componente}</span>·{m.texto}— promedio{m.promedio.toFixed(1)}</li>))}</ul>)}
{mejora.quiz.length>0&&(<><div style={{fontSize:12.5,fontWeight:600,marginBottom:4}}>Conocimientos básicos — preguntas a repasar</div><ul style={{margin:0,paddingLeft:20,fontSize:13}}>{mejora.quiz.map((m,i)=>(<li key={i}style={{marginBottom:4}}>{m.texto}— respondió"{m.tuRespuesta}",la correcta es"{m.correcta}"</li>))}</ul></>)}
{mejora.todos.length>0&&(<><button className="toggle-link"style={{fontSize:11.5,marginTop:4}}onClick={()=>setVerTodo(!verTodo)}>{verTodo?'Ocultar':'Ver'}el detalle completo de las{mejora.todos.length}afirmaciones evaluadas(para verificar el cálculo)</button>{verTodo&&(<ul style={{margin:'8px 0 0',paddingLeft:20,fontSize:12,color:'var(--ink-soft)'}}>{mejora.todos.map((m,i)=>(<li key={i}style={{marginBottom:3}}><span style={{fontFamily:'var(--font-mono)',fontSize:10.5}}>{m.componente}</span>·{m.texto}— promedio{m.promedio.toFixed(1)}({m.evaluadores}evaluador{m.evaluadores===1?'':'es'})</li>))}</ul>)}</>)}</div>):(<div style={{marginTop:20,paddingTop:16,borderTop:'1px solid var(--border)'}}><h4 style={{margin:'0 0 4px',fontFamily:'var(--font-display)'}}>Áreas para plan de acción</h4>{mejora.todos.length===0?(<p className="hint"style={{marginTop:0}}>No se encontró ninguna respuesta por pregunta guardada para esta persona(ni de evaluadores externos,ni de su propio quiz)— puede ser que todavía no la hayan evaluado,o que las respuestas se hayan guardado de otra forma.Esto sí sería motivo para revisar.</p>):(<><p className="hint"style={{marginTop:0}}>Ninguna afirmación promedió por debajo de 4 — por eso no hay nada que listar aquí.Detalle de los promedios reales,para verificar:</p><ul style={{margin:0,paddingLeft:20,fontSize:12,color:'var(--ink-soft)'}}>{mejora.todos.map((m,i)=>(<li key={i}style={{marginBottom:3}}><span style={{fontFamily:'var(--font-mono)',fontSize:10.5}}>{m.componente}</span>·{m.texto}— promedio{m.promedio.toFixed(1)}({m.evaluadores}evaluador{m.evaluadores===1?'':'es'})</li>))}</ul></>)}</div>)}</div>);};ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script>
